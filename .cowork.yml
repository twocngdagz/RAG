models:
  implementer:
    provider: anthropic
    model: claude-opus-5
    cliAdapter:
      kind: claude
      command: claude
      args:
        - --effort
        - max
        - --include-partial-messages
        - --permission-mode
        - acceptEdits
        - --allowedTools
        - Bash(git status:*) Bash(git add:*) Bash(git commit:*) Bash(git diff:*) Bash(git log:*)
          Bash(python:*) Bash(.venv/bin/python:*)
      timeout: 604800
      idleTimeout: 900
  reviewer:
    provider: anthropic
    model: claude-opus-4-8
    cliAdapter:
      kind: claude
      command: claude
      args:
        - --effort
        - max
        - --include-partial-messages
        - --allowedTools
        - Bash(git status:*) Bash(git diff:*) Bash(git log:*) Bash(python:*) Bash(.venv/bin/python:*)
      timeout: 604800
      idleTimeout: 900
roles:
  implementer:
    model: implementer
  reviewer:
    model: reviewer
configVersion: 3
debate:
  enabled: true
reviewGated:
  identity:
    minimumAssurance: config_only
    requireDifferentAdapterKinds: false
    prohibitSharedSessions: true
  commit:
    mode: human_required
    agentMayCommit: false
  gates:
    planReview: required
    codeReview: required
    verification: required
    humanMerge: required
    blockingSeverities:
      - critical
      - high
    requireAllFindingResponses: true
    requireAcceptedAttestations: true
  pacing:
    maxCodeReviewRounds: 3
    maxCorrectionPasses: 2
    deferNonBlockingFindings: true
    unresolvedAfterFinalReview: human_decision_required
  autonomous:
    maxPlanReviewRoundsPerBatch: 2
    maxCodeReviewRoundsPerBatch: 3
    maxCorrectionPassesPerBatch: 2
    maxVerificationAttemptsPerCommand: 2
    maxFinalAuditsPerBatch: 1
    maxAgentInvocationsPerBatch: 12
    maxTotalAgentInvocations: 100
    maxBatchRuntimeMinutes: 240
    maxWorkflowRuntimeMinutes: 1440
    maxConsecutiveNoProgressActions: 2
    maxInputTokensPerBatch: 25000000
    maxOutputTokensPerBatch: 2000000
    maxCostUsdPerWorkflow: 25
    heartbeatIntervalSeconds: 30
    heartbeatExpirySeconds: 120
