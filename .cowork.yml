models:
  implementer:
    provider: cursor
    model: cursor-grok-4.5-medium
    cliAdapter:
      kind: cursor
      command: cursor-agent
      # --force is the workspace-trust gate. Without it cursor-agent does not
      # fail cleanly -- it can hang indefinitely -- and with idle detection
      # disabled a hang burns the whole budget. The flag is required here so a
      # missing-trust hang is impossible rather than merely unlikely.
      args:
        - --force
      # Grok/GPT models are silent until finished; silence is not a health
      # signal, so idle detection is disabled (7 days) and liveness is judged
      # by CPU on the child process, never by log growth. Effort is part of the
      # model id (-high), so there is no effort flag.
      timeout: 604800
      idleTimeout: 604800
  reviewer:
    provider: cursor
    model: gpt-5.6-sol-medium
    cliAdapter:
      kind: cursor
      command: cursor-agent
      # Sol is silent until finished, like Grok — so the same rules apply:
      # --force is the trust gate, idle detection is disabled (7 days), and
      # liveness is judged by CPU on the child process, not by log growth.
      # Effort is in the model id (-medium); there is no effort flag.
      args:
        - --force
      timeout: 604800
      idleTimeout: 604800
roles:
  implementer:
    model: implementer
  reviewer:
    model: reviewer
configVersion: 3
debate:
  enabled: true
reviewGated:
  identity:
    minimumAssurance: config_only
    requireDifferentAdapterKinds: false
    prohibitSharedSessions: true
  commit:
    mode: human_required
    agentMayCommit: false
  gates:
    planReview: required
    codeReview: required
    verification: required
    humanMerge: required
    blockingSeverities:
      - critical
      - high
    requireAllFindingResponses: true
    requireAcceptedAttestations: true
  pacing:
    maxCodeReviewRounds: 3
    maxCorrectionPasses: 2
    deferNonBlockingFindings: true
    unresolvedAfterFinalReview: human_decision_required
  autonomous:
    maxPlanReviewRoundsPerBatch: 2
    maxCodeReviewRoundsPerBatch: 3
    maxCorrectionPassesPerBatch: 2
    maxVerificationAttemptsPerCommand: 2
    maxFinalAuditsPerBatch: 1
    maxAgentInvocationsPerBatch: 12
    maxTotalAgentInvocations: 100
    maxBatchRuntimeMinutes: 240
    maxWorkflowRuntimeMinutes: 1440
    maxConsecutiveNoProgressActions: 2
    maxInputTokensPerBatch: 25000000
    maxOutputTokensPerBatch: 2000000
    maxCostUsdPerWorkflow: 25
    heartbeatIntervalSeconds: 30
    heartbeatExpirySeconds: 120
