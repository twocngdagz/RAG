<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7490" />
    <meta
      name="description"
      content="Grounded PTE Academic study materials — every explanation traceable to the source."
    />
    <!-- Neutral fallback shown before React sets the per-book title (see App.tsx). -->
    <title>Grounded study materials</title>
    <!-- Preconnect + swap so text paints immediately (no FOIT). Lexend is
         designed to improve reading proficiency, fitting for a learning app. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
